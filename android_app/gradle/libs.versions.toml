# ==============================================================================
# Version catalog — shared baseline for all 10 client projects.
# ==============================================================================
# Policy (enforced by platform/scripts/ci_gate.sh step 4):
#   NO alpha / beta / rc / SNAPSHOT artifacts in a shipping build.
#   The previous catalog pinned okhttp 5.0.0-alpha.16 — replaced with 4.12.0 stable.
# ==============================================================================

[versions]
agp = "8.7.3"
kotlin = "2.1.0"
ksp = "2.1.0-1.0.29"
composeBom = "2024.12.01"
coreKtx = "1.15.0"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
navigationCompose = "2.8.5"
retrofit = "2.11.0"
okhttp = "4.12.0"
serializationJson = "1.7.3"
koin = "4.0.0"
coil = "2.7.0"
room = "2.6.1"
datastore = "1.1.1"
coroutines = "1.9.0"
securityCrypto = "1.1.0-alpha06"
sqlcipher = "4.5.4"
junit = "4.13.2"
kotlinTest = "2.1.0"
coroutinesTest = "1.9.0"
turbine = "1.2.0"
mockwebserver = "4.12.0"
androidxTestJunit = "1.2.1"
espresso = "3.6.1"
detekt = "1.23.7"

[libraries]
compose-bom            = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui             = { module = "androidx.compose.ui:ui" }
compose-ui-graphics    = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling     = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-material3      = { module = "androidx.compose.material3:material3" }

androidx-core-ktx      = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose   = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

retrofit               = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp                 = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }

koin-core              = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android           = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-androidx-compose  = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }

coil-compose           = { module = "io.coil-kt:coil-compose", version.ref = "coil" }

room-runtime           = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx               = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler          = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing           = { module = "androidx.room:room-testing", version.ref = "room" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
sqlcipher              = { module = "net.zetetic:android-database-sqlcipher", version.ref = "sqlcipher" }

junit                  = { module = "junit:junit", version.ref = "junit" }
kotlin-test            = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlinTest" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutinesTest" }
turbine                = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
mockwebserver          = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "mockwebserver" }
androidx-test-junit    = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
espresso-core          = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application    = { id = "com.android.application", version.ref = "agp" }
android-library        = { id = "com.android.library", version.ref = "agp" }
kotlin-android         = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose         = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization   = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                    = { id = "com.google.devtools.ksp", version.ref = "ksp" }
detekt                 = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
